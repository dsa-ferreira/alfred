[project]
name = "alfred"
version = "0.16.2"
description = "Telegram bot and service API in front of the local AI, with its own MCP agent loop"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram",
    "fastapi",
    "uvicorn",
    "httpx",
    "mcp>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "alembic",
    "psycopg[binary]>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings",
    "pgvector>=0.5.1",
    "tzdata>=2026.6",
    "trafilatura>=2.3.1",
    "pint>=0.26.2",
    "aiobotocore>=3.10.0",
    "pypdfium2>=5.15.2",
    "pillow>=13.0.0",
]

[project.scripts]
alfred = "alfred.cli:run"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "testcontainers[postgres]",
    "ruff",
    "moto[s3,server]>=5.2.5",
    "import-linter>=2.16",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

# The ranks of AGENTS.md ("Code layout"): a package imports only from its own
# row or the rows below it. "a | b" are siblings that must not import each
# other; "a : b" may. Imports under TYPE_CHECKING count.
[tool.importlinter]
root_package = "alfred"
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
name = "ranks and feature order"
type = "layers"
containers = ["alfred"]
exhaustive = true
layers = [
    # entry
    "app : cli : config : schema : startup",
    # adapters
    "telegram | http",
    # runtime
    "turns",
    "agent",
    # features, in their declared order
    "archive | facts | reminders | web | mcp | toolbox",
    "conversations",
    "attachments",
    "brains",
    # kernel
    "kernel",
    # infra
    "db | llm | backoff | times",
    "settings",
]
